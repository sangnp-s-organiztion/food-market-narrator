services:
  - type: web
    name: food-market-narrator-api
    env: docker
    plan: free
    dockerfilePath: ./FoodMarketNarrator.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Cors__AllowedOrigins
        sync: false
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: MongoDb__ConnectionString
        sync: false
      - key: MongoDb__DatabaseName
        value: food_market_narrator
      - key: LibreTranslate__BaseUrl
        sync: false
      - key: EdgeTts__BaseUrl
        sync: false
      - key: Smtp__Host
        sync: false
      - key: Smtp__Port
        sync: false
      - key: Smtp__EnableSsl
        value: true
      - key: Smtp__Username
        sync: false
      - key: Smtp__Password
        sync: false
      - key: Smtp__FromEmail
        sync: false
      - key: Smtp__FromName
        value: Food Market Narrator

  - type: web
    name: food-market-narrator-admin
    runtime: static
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://food-market-narrator-api.onrender.com

  - type: web
    name: food-market-narrator-saler
    runtime: static
    rootDir: saler
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://food-market-narrator-api.onrender.com
