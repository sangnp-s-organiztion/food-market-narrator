<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Food Market Narrator</title>
    <style>
      :root {
        --bg: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --accent: #0f766e;
        --accent-2: #1d4ed8;
        --border: #cbd5e1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .card {
        width: min(560px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      p {
        margin: 10px 0 0;
        line-height: 1.5;
        color: var(--muted);
      }

      .actions {
        margin-top: 20px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn {
        border: 0;
        border-radius: 12px;
        padding: 11px 16px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .btn-open {
        background: var(--accent);
        color: #fff;
      }

      .btn-download {
        background: var(--accent-2);
        color: #fff;
      }

      .small {
        margin-top: 12px;
        font-size: 0.86rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Opening Food Market Narrator...</h1>
      <p>
        If the app is installed, it should open automatically. If it does not
        open, use the buttons below.
      </p>

      <div class="actions">
        <a
          id="openAppBtn"
          class="btn btn-open"
          href="foodmarketnarrator://open"
        >
          Open App
        </a>
        <a id="downloadBtn" class="btn btn-download" href="/apk-download.html">
          Download APK
        </a>
      </div>

      <p class="small" id="statusText">Trying to open app now...</p>
    </main>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var appLink = params.get("appLink") || "foodmarketnarrator://open";
        var apkParam = params.get("apk");
        var fallbackUrl = new URL("/apk-download.html", window.location.origin);

        if (apkParam) {
          fallbackUrl.searchParams.set("apk", apkParam);
        }

        var openBtn = document.getElementById("openAppBtn");
        var downloadBtn = document.getElementById("downloadBtn");
        var statusText = document.getElementById("statusText");
        var hiddenByAppSwitch = false;

        openBtn.href = appLink;
        downloadBtn.href = fallbackUrl.toString();

        var timer = window.setTimeout(function () {
          if (hiddenByAppSwitch) {
            return;
          }

          statusText.textContent =
            "App not detected. Redirecting to APK download page...";
          window.location.replace(fallbackUrl.toString());
        }, 1800);

        function markAsOpened() {
          hiddenByAppSwitch = true;
          window.clearTimeout(timer);
        }

        document.addEventListener("visibilitychange", function () {
          if (document.hidden) {
            markAsOpened();
          }
        });

        window.addEventListener("pagehide", markAsOpened);

        window.location.href = appLink;
      })();
    </script>
  </body>
</html>
