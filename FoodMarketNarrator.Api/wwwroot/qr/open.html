<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Food Market Narrator - Open App</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --card: #ffffff;
        --ink: #16202a;
        --muted: #4b5a6a;
        --brand: #0f7b6c;
        --brand-strong: #0a5f54;
        --line: #d9e1ea;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 10%, #e6f6f2 0%, transparent 40%),
          radial-gradient(circle at 90% 90%, #e8eef8 0%, transparent 45%),
          var(--bg);
        display: grid;
        place-items: center;
        padding: 16px;
      }

      .card {
        width: min(520px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 16px 48px rgba(12, 33, 53, 0.08);
        padding: 22px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
        line-height: 1.3;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .status {
        margin-top: 14px;
        font-size: 0.92rem;
        color: var(--muted);
        padding: 10px 12px;
        border: 1px dashed var(--line);
        border-radius: 10px;
        background: #f9fbfd;
      }

      .actions {
        margin-top: 18px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button,
      a {
        border: 0;
        border-radius: 10px;
        font-size: 0.95rem;
        text-decoration: none;
        cursor: pointer;
        padding: 10px 14px;
      }

      .primary {
        background: var(--brand);
        color: #fff;
      }

      .primary:hover {
        background: var(--brand-strong);
      }

      .ghost {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <main class="card" aria-live="polite">
      <h1>Opening Food Market Narrator...</h1>
      <p>
        If the app is already installed, your phone will open it automatically.
        If not, this page will redirect you to APK download.
      </p>

      <div id="status" class="status">Preparing secure handoff...</div>

      <div class="actions">
        <button type="button" id="openNowBtn" class="primary">
          Open app now
        </button>
        <a id="downloadLink" class="ghost" href="/qr/download.html"
          >Go to APK page</a
        >
      </div>
    </main>

    <script>
      (function () {
        var USER_SESSION_START_ENDPOINT = "/api/user-sessions/start";
        var DEVICE_ID_KEY = "fmn_qr_device_id";
        var LAST_SESSION_KEY = "fmn_qr_last_session_id";
        var FALLBACK_DELAY_MS = 1600;
        var APP_DEEP_LINK_BASE = "foodmarketnarrator://open";
        var statusEl = document.getElementById("status");
        var openNowBtn = document.getElementById("openNowBtn");
        var downloadLink = document.getElementById("downloadLink");
        var hiddenByAppSwitch = false;

        function setStatus(message) {
          if (statusEl) {
            statusEl.textContent = message;
          }
        }

        function randomId() {
          if (window.crypto && window.crypto.randomUUID) {
            return window.crypto.randomUUID().replace(/-/g, "");
          }

          var segment = function () {
            return Math.floor((1 + Math.random()) * 0x10000)
              .toString(16)
              .substring(1);
          };

          return (
            Date.now().toString(16) +
            segment() +
            segment() +
            segment() +
            segment()
          ).toLowerCase();
        }

        function getOrCreateDeviceId() {
          var existing = window.localStorage.getItem(DEVICE_ID_KEY);
          if (existing && existing.trim()) {
            return existing.trim();
          }

          var generated = "web-" + randomId();
          window.localStorage.setItem(DEVICE_ID_KEY, generated);
          return generated;
        }

        function toQueryString(params) {
          return new URLSearchParams(params).toString();
        }

        function startUserSession(sessionId, deviceId) {
          var payload = {
            sessionId: sessionId,
            deviceId: deviceId,
            deviceInfo: "qr-web:" + (navigator.userAgent || "unknown"),
          };

          var json = JSON.stringify(payload);
          if (navigator.sendBeacon) {
            var blob = new Blob([json], { type: "application/json" });
            navigator.sendBeacon(USER_SESSION_START_ENDPOINT, blob);
            return;
          }

          fetch(USER_SESSION_START_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: json,
            keepalive: true,
          }).catch(function () {
            /* ignore best effort errors */
          });
        }

        function openApp(appUrl) {
          setStatus("Trying to open app...");
          window.location.href = appUrl;
        }

        function buildRuntimeContext() {
          var currentSessionId = randomId();
          var deviceId = getOrCreateDeviceId();
          window.localStorage.setItem(LAST_SESSION_KEY, currentSessionId);

          var query = toQueryString({ sid: currentSessionId, did: deviceId });
          var appDeepLink = APP_DEEP_LINK_BASE + "?" + query;
          var fallbackUrl = "/qr/download.html?" + query;

          if (downloadLink) {
            downloadLink.href = fallbackUrl;
          }

          return {
            sessionId: currentSessionId,
            deviceId: deviceId,
            appDeepLink: appDeepLink,
            fallbackUrl: fallbackUrl,
          };
        }

        document.addEventListener("visibilitychange", function () {
          if (document.hidden) {
            hiddenByAppSwitch = true;
          }
        });

        var ctx = buildRuntimeContext();
        startUserSession(ctx.sessionId, ctx.deviceId);

        if (openNowBtn) {
          openNowBtn.addEventListener("click", function () {
            openApp(ctx.appDeepLink);
          });
        }

        setTimeout(function () {
          if (!hiddenByAppSwitch) {
            setStatus("App was not opened. Redirecting to APK page...");
            window.location.replace(ctx.fallbackUrl);
          }
        }, FALLBACK_DELAY_MS);

        openApp(ctx.appDeepLink);
      })();
    </script>
  </body>
</html>
